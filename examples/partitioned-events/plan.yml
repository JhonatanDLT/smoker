invariants:
  - id: events_amount_non_negative
    table: part.events
    description: event amounts are never negative
    sql: |
      SELECT id FROM part.events WHERE amount < 0

  - id: audit_payload_is_object
    table: part.audit
    description: audit payloads are JSON objects
    sql: |
      SELECT id FROM part.audit WHERE jsonb_typeof(payload) <> 'object'

  - id: audit_kind_is_known
    table: part.audit
    description: audit kind is one of the partitioned values
    sql: |
      SELECT id FROM part.audit WHERE kind NOT IN ('login', 'purchase')

  - id: tenant_events_amount_non_negative
    table: part.tenant_events
    description: tenant event amounts are never negative
    sql: |
      SELECT id FROM part.tenant_events WHERE amount < 0

  - id: logs_level_is_known
    table: part.logs
    description: log level is one of the sub-partitioned values
    sql: |
      SELECT id FROM part.logs WHERE level NOT IN ('info', 'error')
