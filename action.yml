name: "smoker"
description: "Generate synthetic Postgres data and verify every invariant."
author: "smoker"
branding:
  icon: "shield"
  color: "blue"

inputs:
  source-dsn:
    description: "PostgreSQL DSN for the source schema. Pass it from secrets."
    required: true
  target-dsn:
    description: "PostgreSQL DSN for the target database. Use an ephemeral CI database."
    required: true
  rows:
    description: "Rows per table."
    required: false
    default: "5000"
  seed:
    description: "Deterministic seed."
    required: false
    default: "42"
  spec:
    description: "Path to the YAML spec with application rules and repairs."
    required: false
    default: ""
  profile:
    description: "Path to a profile JSON produced by `smoker profile`."
    required: false
    default: ""
  fail-on:
    description: "never (shadow), error, or fail."
    required: false
    default: "fail"
  max-passes:
    description: "Repair fixed-point limit."
    required: false
    default: "3"
  format:
    description: "Comma-separated report formats: json,html,junit."
    required: false
    default: "json,html,junit"
  out:
    description: "Output directory for the reports."
    required: false
    default: "proof"
  version:
    description: "smoker version to install, or 'source' to install this action's checkout."
    required: false
    default: "source"
  python-version:
    description: "Python version."
    required: false
    default: "3.12"
  upload-artifact:
    description: "Upload the report directory as an artifact."
    required: false
    default: "true"
  allow-same-db:
    description: "Allow source and target to be the same database."
    required: false
    default: "false"

outputs:
  verdict:
    description: "PASS or FAIL."
    value: ${{ steps.run.outputs.verdict }}
  dataset-hash:
    description: "SHA-256 of the generated dataset."
    value: ${{ steps.run.outputs.dataset_hash }}
  report-path:
    description: "Path to the JSON report."
    value: ${{ steps.run.outputs.report_path }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: "pip"

    - name: Install smoker
      shell: bash
      run: |
        if [ "${{ inputs.version }}" = "source" ]; then
          python -m pip install --disable-pip-version-check "${{ github.action_path }}"
        else
          python -m pip install --disable-pip-version-check "smoker==${{ inputs.version }}"
        fi

    - name: Generate and verify
      id: run
      shell: bash
      continue-on-error: true
      env:
        SMOKER_SOURCE_DSN: ${{ inputs.source-dsn }}
        SMOKER_TARGET_DSN: ${{ inputs.target-dsn }}
        SMOKER_FAIL_ON: ${{ inputs.fail-on }}
        SMOKER_SPEC: ${{ inputs.spec }}
        SMOKER_PROFILE: ${{ inputs.profile }}
        SMOKER_ROWS: ${{ inputs.rows }}
        SMOKER_SEED: ${{ inputs.seed }}
        SMOKER_MAX_PASSES: ${{ inputs.max-passes }}
        SMOKER_FORMAT: ${{ inputs.format }}
        SMOKER_OUT: ${{ inputs.out }}
        SMOKER_ALLOW_SAME_DB: ${{ inputs.allow-same-db }}
      run: |
        set -uo pipefail
        if [ "$SMOKER_ALLOW_SAME_DB" != "true" ] && [ "$SMOKER_SOURCE_DSN" = "$SMOKER_TARGET_DSN" ]; then
          echo "::error title=smoker::source-dsn and target-dsn are the same database"
          echo "exit_code=2" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        args=(
          --source-env SMOKER_SOURCE_DSN
          --target-env SMOKER_TARGET_DSN
          --rows "$SMOKER_ROWS"
          --seed "$SMOKER_SEED"
          --max-passes "$SMOKER_MAX_PASSES"
          --format "$SMOKER_FORMAT"
          --fail-on "$SMOKER_FAIL_ON"
          --out "$SMOKER_OUT"
        )
        if [ -n "$SMOKER_SPEC" ]; then args+=(--spec "$SMOKER_SPEC"); fi
        if [ -n "$SMOKER_PROFILE" ]; then args+=(--profile "$SMOKER_PROFILE"); fi

        set +e
        smoker run "${args[@]}"
        code=$?
        set -e

        echo "exit_code=$code" >> "$GITHUB_OUTPUT"
        echo "report_path=$SMOKER_OUT/report.json" >> "$GITHUB_OUTPUT"

        if [ -f "$SMOKER_OUT/report.json" ]; then
          python "${{ github.action_path }}/scripts/annotate.py" \
            --report "$SMOKER_OUT/report.json" \
            --policy "$SMOKER_FAIL_ON"
          verdict=$(python -c "import json;print(json.load(open('$SMOKER_OUT/report.json'))['verdict'])")
          digest=$(python -c "import json;print(json.load(open('$SMOKER_OUT/report.json'))['dataset_hash'])")
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "dataset_hash=$digest" >> "$GITHUB_OUTPUT"
        fi

    - name: Upload report
      if: ${{ always() && inputs.upload-artifact == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: smoker-report
        path: ${{ inputs.out }}
        if-no-files-found: ignore

    - name: Fail the job
      if: ${{ steps.run.outputs.exit_code != '0' }}
      shell: bash
      run: |
        echo "smoker exited with ${{ steps.run.outputs.exit_code }}"
        exit 1
